<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0B0D" />
    <meta
      name="description"
      content="FLOW — Automate the work. Build production automations visually: triggers, actions, conditions, AI and integrations on one canvas."
    />
    <title>FLOW — Automate the work.</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0B0D'/%3E%3Cpath d='M11 9h11M11 16h8M11 23h5' stroke='%23C7F53D' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Applied before paint so there is never a theme flash.
      (function () {
        try {
          var stored = localStorage.getItem('flow.theme');
          var mode = stored ? JSON.parse(stored) : 'dark';
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
